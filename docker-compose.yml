# The whole stack, reproducibly. `docker compose up` gives the same thing the
# hosted deployment runs; `make run` is the faster loop for development.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dbx
      POSTGRES_PASSWORD: dbx
      POSTGRES_DB: dbx
    ports: ["5432:5432"]
    volumes: ["dbx_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbx"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-target:
    build: .
    command: uvicorn dbx_mock_target:app --host 0.0.0.0 --port 8081
    environment:
      MOCK_TARGET_DB: /data/mock-target.db
    volumes: ["dbx_target:/data"]
    # Reachable only from the API, the way a destination system would be.
    expose: ["8081"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DBX_DATA_DIR: /data
      MOCK_TARGET_URL: http://mock-target:8081
      # Supplied at run time; never baked into the image.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AWS_BEARER_TOKEN_BEDROCK: ${OPENAI_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      MODEL_ID: ${MODEL_ID:-openai.gpt-oss-120b-1:0}
    volumes: ["dbx_data:/data"]
    depends_on:
      mock-target:
        condition: service_healthy

volumes:
  dbx_pgdata:
  dbx_data:
  dbx_target:
