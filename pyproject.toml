[project]
name = "darwinbox-data-bridge"
version = "0.1.0"
description = "AI agent for client HR data migration and integration"
requires-python = ">=3.12,<3.13"
dependencies = [
  "contracts",
  "migration-core",
  "extraction",
  "agent",
  "api",
  "worker",
  "mock-target",
]

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6", "openpyxl>=3.1", "ruff>=0.6", "httpx>=0.27"]

[tool.uv.workspace]
members = [
  "packages/migration-core",
  "packages/extraction",
  "packages/agent",
  "packages/contracts",
  "services/api",
  "services/worker",
  "services/mock-target",
]

[tool.uv.sources]
contracts = { workspace = true }
migration-core = { workspace = true }
extraction = { workspace = true }
agent = { workspace = true }
api = { workspace = true }
worker = { workspace = true }
mock-target = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Calendar dates carry no timezone; attaching one would invent data.
"packages/migration-core/src/dbx_migration_core/cleanup.py" = ["DTZ007"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "services"]
addopts = "-q -p no:warnings"
