[project]
name = "darwinbox-data-bridge"
version = "0.1.0"
description = "AI agent for client HR data migration and integration"
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = [
  "packages/migration-core",
  "packages/extraction",
  "packages/agent",
  "packages/contracts",
  "services/api",
  "services/worker",
  "services/mock-target",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "services"]
addopts = "-q"
