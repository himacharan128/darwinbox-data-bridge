[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["contracts", "migration-core", "boto3>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbx_agent"]

[tool.uv.sources]
contracts = { workspace = true }
migration-core = { workspace = true }
