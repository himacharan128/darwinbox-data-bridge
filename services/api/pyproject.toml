[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["contracts", "migration-core", "extraction", "agent", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "python-multipart>=0.0.9", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbx_api"]

[tool.uv.sources]
contracts = { workspace = true }
migration-core = { workspace = true }
extraction = { workspace = true }
agent = { workspace = true }
