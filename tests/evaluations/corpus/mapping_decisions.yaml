_doc: Labelled source-column -> target-field mapping decisions. `auto` means the agent must apply it with
  no human confirmation; escalating an `auto` case counts against escalation precision. `basis` records
  which evidence signal should carry the decision, so a regression that starts relying on the LLM vote
  for a case marked name/mask/type_parse is visible.
_alias_independence: Only 8 of 35 columns are resolvable via a declared alias. The rest must map on measured
  evidence, which is what proves the engine is not alias-driven.
_phase2_target: Expand to ~80 mapping decisions including adversarial negatives.
