  relabelled: Target field declares no discriminating constraint (no non-string type, pattern, enum or
    uniqueness), so the only evidence is header similarity plus the model's opinion — and the model's
    weight is capped precisely so it cannot decide alone. Declaring an alias or a constraint on the target
    field moves this case to auto, which is the affordance a consultant should reach for.
