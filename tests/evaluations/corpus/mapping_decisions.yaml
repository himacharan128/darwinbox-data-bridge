_doc: Labelled source-column to target-field decisions across five exports in five naming cultures. `auto`
  must be applied with no human input; `escalate` must raise a case; `no_map` must be left alone — a corpus
  of only mappable columns measures nothing about restraint.
_alias_independence: Aliases are declared for 4 target fields. Every other column must map on measured
  evidence.
_counts:
  total: 77
  auto: 57
  escalate: 2
  no_map: 18
